<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>where-i-put</title>
<style>
  :root{
    --font-body:system-ui,'Segoe UI',sans-serif;
    --font-mono:ui-monospace,'Cascadia Code',monospace;
    --surface-0:#05070C;
    --surface-1:#0A0D12;
    --surface-2:#0F131C;
    --surface-3:#161D2B;
    --surface-4:#1E2636;
    --accent:#38BDF8;
    --accent-dim:#1E293B;
    --text:#E2E8F0;
    --text-dim:#94A3B8;
    --text-muted:#64748B;
    --success:#6EE7B7;
    --warning:#FBBF24;
    --danger:#F87171;
    --radius-pill:999px;
    --radius-card:16px;
    --radius-small:8px;
    --spacing-xs:clamp(0.25rem,0.5vw,0.5rem);
    --spacing-sm:clamp(0.5rem,1vw,0.75rem);
    --spacing-md:clamp(0.75rem,1.5vw,1.25rem);
    --spacing-lg:clamp(1rem,2vw,1.5rem);
    --spacing-xl:clamp(1.5rem,3vw,2.5rem);
    --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.3);
    --shadow-md:0 4px 8px -2px rgb(0 0 0 / 0.4);
    --shadow-lg:0 10px 20px -5px rgb(0 0 0 / 0.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--surface-0);
    color:var(--text);
    font-family:var(--font-body);
    font-size:clamp(0.9375rem,1vw + 0.75rem,1.0625rem);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:color-mix(in srgb,var(--surface-1) 92%,transparent);
    backdrop-filter:blur(12px) saturate(1.5);
    border-bottom:1px solid color-mix(in srgb,var(--accent) 12%,transparent);
    padding:var(--spacing-md) var(--spacing-lg);
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:var(--spacing-md);
    align-items:center;
  }
  @media(max-width:800px){
    header{grid-template-columns:1fr;gap:var(--spacing-sm)}
  }
  h1{
    font-size:clamp(1.125rem,1.5vw + 0.875rem,1.5rem);
    font-weight:600;
    letter-spacing:-0.02em;
    color:var(--text);
  }
  h1 .dot{color:var(--accent)}
  .controls{
    display:flex;
    gap:var(--spacing-sm);
    flex-wrap:wrap;
    justify-self:end;
  }
  @media(max-width:800px){
    .controls{justify-self:stretch}
  }
  input[type=search],input[type=text]{
    background:var(--surface-2);
    color:var(--text);
    border:1px solid color-mix(in srgb,var(--accent) 15%,transparent);
    border-radius:var(--radius-pill);
    padding:var(--spacing-sm) var(--spacing-md);
    font:inherit;
    font-size:clamp(0.875rem,0.9vw + 0.7rem,0.9375rem);
    outline:none;
    transition:border-color 0.15s,box-shadow 0.15s;
    min-width:0;
    flex:1;
  }
  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);
  }
  button{
    background:var(--surface-3);
    color:var(--text);
    border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
    border-radius:var(--radius-pill);
    padding:var(--spacing-sm) var(--spacing-md);
    font:inherit;
    font-size:clamp(0.875rem,0.9vw + 0.7rem,0.9375rem);
    font-weight:500;
    cursor:pointer;
    transition:all 0.15s;
    white-space:nowrap;
  }
  button:hover{
    background:var(--surface-4);
    border-color:var(--accent);
    box-shadow:var(--shadow-sm);
  }
  button:active{transform:translateY(1px)}
  #answer{
    display:none;
    margin:var(--spacing-lg) var(--spacing-lg) 0;
    padding:var(--spacing-md) var(--spacing-lg);
    background:var(--surface-2);
    border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);
    border-left:4px solid var(--accent);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-md);
  }
  #grid{
    display:grid;
    gap:var(--spacing-lg);
    padding:var(--spacing-xl) var(--spacing-lg);
    grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));
  }
  .card{
    background:var(--surface-2);
    border:1px solid color-mix(in srgb,var(--accent) 12%,transparent);
    border-radius:var(--radius-card);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform 0.2s,box-shadow 0.2s;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-lg);
    border-color:color-mix(in srgb,var(--accent) 30%,transparent);
  }
  .shot{
    aspect-ratio:16/9;
    background:var(--surface-0);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    font-size:clamp(0.8125rem,0.8vw + 0.65rem,0.875rem);
    cursor:zoom-in;
    position:relative;
    overflow:hidden;
  }
  .shot img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .body{
    padding:var(--spacing-md);
    display:flex;
    flex-direction:column;
    gap:var(--spacing-sm);
  }
  .label{
    font-size:clamp(1rem,1.1vw + 0.85rem,1.125rem);
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--text);
  }
  .row{
    display:flex;
    gap:var(--spacing-xs);
    flex-wrap:wrap;
    align-items:center;
  }
  .chip{
    background:var(--surface-4);
    border:1px solid color-mix(in srgb,var(--accent) 15%,transparent);
    border-radius:var(--radius-pill);
    padding:var(--spacing-xs) clamp(0.5rem,1vw,0.75rem);
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
    color:var(--text-dim);
    font-weight:500;
  }
  .meta{
    color:var(--text-muted);
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
    line-height:1.5;
  }
  .hits{
    margin-left:auto;
    color:var(--accent);
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
    font-weight:600;
  }
  #empty{
    display:none;
    padding:clamp(3rem,8vw,5rem) var(--spacing-lg);
    text-align:center;
    color:var(--text-muted);
  }
  #empty code{
    background:var(--surface-2);
    padding:var(--spacing-xs) var(--spacing-sm);
    border-radius:var(--radius-small);
    font-family:var(--font-mono);
    font-size:0.875em;
  }
  dialog{
    background:var(--surface-2);
    color:var(--text);
    border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
    border-radius:var(--radius-card);
    max-width:min(1200px,94vw);
    padding:0;
    box-shadow:var(--shadow-lg);
  }
  dialog::backdrop{background:rgb(0 0 0 / 0.75);backdrop-filter:blur(4px)}
  dialog img{display:block;max-width:100%;border-radius:var(--radius-card) var(--radius-card) 0 0}
  dialog .cap{
    padding:var(--spacing-md) var(--spacing-lg);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:var(--spacing-md);
    border-top:1px solid color-mix(in srgb,var(--accent) 12%,transparent);
  }
  footer{
    color:var(--text-muted);
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
    text-align:center;
    padding:var(--spacing-md) var(--spacing-lg) var(--spacing-xl);
  }
  #answer .direct{
    font-size:clamp(0.9375rem,1vw + 0.8rem,1.0625rem);
    line-height:1.6;
  }
  #answer .note{
    color:var(--text-dim);
    font-size:clamp(0.8125rem,0.9vw + 0.7rem,0.875rem);
    margin-top:var(--spacing-sm);
  }
  #cards{
    display:flex;
    flex-direction:column;
    gap:var(--spacing-md);
    margin-top:var(--spacing-md);
  }
  .ev{
    border:2px dashed color-mix(in srgb,var(--accent) 25%,transparent);
    border-radius:var(--radius-card);
    padding:var(--spacing-md) var(--spacing-lg);
    background:var(--surface-3);
  }
  .ev .tag{
    display:inline-block;
    font-size:clamp(0.6875rem,0.7vw + 0.55rem,0.75rem);
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--warning);
    border:1px solid color-mix(in srgb,var(--warning) 40%,transparent);
    border-radius:var(--radius-small);
    padding:var(--spacing-xs) var(--spacing-sm);
    margin-right:var(--spacing-sm);
    font-weight:600;
  }
  .ev h3{
    margin:0 0 var(--spacing-sm);
    font-size:clamp(0.9375rem,1vw + 0.8rem,1.0625rem);
    font-weight:600;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:var(--spacing-xs);
    line-height:1.4;
  }
  .ev .score{
    margin-left:auto;
    color:var(--text-dim);
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
    font-weight:400;
  }
  .ev .expl{
    color:var(--text-dim);
    font-size:clamp(0.8125rem,0.9vw + 0.7rem,0.875rem);
    margin:0 0 var(--spacing-sm);
    line-height:1.6;
  }
  .ev .tl{
    display:flex;
    gap:var(--spacing-xs);
    flex-wrap:wrap;
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
    margin-bottom:var(--spacing-sm);
  }
  .ev .tl span{
    background:var(--surface-4);
    border:1px solid color-mix(in srgb,var(--accent) 15%,transparent);
    border-radius:var(--radius-small);
    padding:var(--spacing-xs) var(--spacing-sm);
  }
  .ev ul{
    list-style:none;
    margin:0 0 var(--spacing-sm);
    padding:0;
    display:flex;
    flex-direction:column;
    gap:var(--spacing-xs);
    font-size:clamp(0.8125rem,0.9vw + 0.7rem,0.875rem);
  }
  .ev li .st{
    display:inline-block;
    min-width:90px;
    font-size:clamp(0.6875rem,0.75vw + 0.6rem,0.75rem);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .st-supporting{color:var(--success)}
  .st-conflicting{color:var(--danger)}
  .st-unknown{color:var(--text-muted)}
  .ev .shots{
    display:flex;
    gap:var(--spacing-md);
    flex-wrap:wrap;
    margin-bottom:var(--spacing-sm);
  }
  .ev figure{
    margin:0;
    position:relative;
    width:min(340px,100%);
  }
  .ev figure img,.ev figure .blank{
    width:100%;
    aspect-ratio:16/9;
    object-fit:contain;
    background:var(--surface-0);
    display:block;
    border-radius:var(--radius-small);
    border:1px solid color-mix(in srgb,var(--accent) 10%,transparent);
  }
  .ev figure .blank{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
  }
  .ev figure svg{
    position:absolute;
    inset:0;
    width:100%;
    aspect-ratio:16/9;
    pointer-events:none;
  }
  .ev figcaption{
    font-size:clamp(0.6875rem,0.75vw + 0.6rem,0.75rem);
    color:var(--text-muted);
    margin-top:var(--spacing-xs);
    line-height:1.4;
  }
  .ev details{
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
    color:var(--text-dim);
  }
  .ev details summary{cursor:pointer;padding:var(--spacing-xs) 0}
  .ev details code{
    word-break:break-all;
    font-family:var(--font-mono);
    font-size:0.9em;
  }
  .ev .caveat{
    font-size:clamp(0.75rem,0.8vw + 0.6rem,0.8125rem);
    color:color-mix(in srgb,var(--warning) 85%,var(--text));
    margin-top:var(--spacing-sm);
    line-height:1.5;
  }
</style>
</head>
<body>
<header>
  <h1>where<span class="dot">·</span>i<span class="dot">·</span>put</h1>
  <input id="q" type="search" placeholder="filter by object…" title='e.g. cup, person, chair' aria-label="filter by object">
  <div class="controls">
    <input id="askq" type="text" placeholder="where is the cup?" title='Ask in plain words, e.g. "where did I put the remote"' aria-label="ask a question">
    <button id="askbtn">Ask</button>
  </div>
</header>

<div id="answer"></div>
<main id="grid"></main>
<div id="empty">
  No observations yet — run the ingest loop:<br>
  <code>cargo run --features "rtsp,yolo" -p item-ingest -- --rtsp &lt;url&gt; --camera-id &lt;id&gt; --config config.toml</code>
</div>
<dialog id="modal">
  <img id="modalimg" alt="observation snapshot">
  <div class="cap"><span id="modalcap"></span><button id="close">Close</button></div>
</dialog>
<footer>auto-refreshes every 10s · <span id="count"></span></footer>

<script>
const $=s=>document.querySelector(s);
const grid=$('#grid'), q=$('#q'), askq=$('#askq'), answer=$('#answer');

// Every string that reaches innerHTML goes through this first. Labels come from
// a detector or a webhook payload -- a model that answers with
// `<img src=x onerror=...>` must not get to run script in the operator's
// browser, where the API is same-origin.
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function relTime(iso){
  const d=(Date.now()-new Date(iso))/1000;
  if(d<60)return 'just now';
  if(d<3600)return Math.floor(d/60)+' min ago';
  if(d<86400)return Math.floor(d/3600)+' h ago';
  return new Date(iso).toLocaleString();
}

function card(o){
  const el=document.createElement('article');
  el.className='card';
  const url='/api/observation/'+o.id+'/snapshot';
  const label=esc(o.label), zone=esc(o.zone), camera=esc(o.camera);
  const shot=o.has_snapshot
    ? '<div class="shot" data-full="'+url+'" data-cap="'+label+' @ '+zone+'"><img loading="lazy" src="'+url+'" alt="'+label+' in '+zone+'"></div>'
    : '<div class="shot">no snapshot</div>';
  el.innerHTML=shot+'<div class="body">'+
    '<div class="label">'+label+'</div>'+
    '<div class="row"><span class="chip">'+zone+'</span>'+
      '<span class="chip">'+camera+'</span>'+
      '<span class="hits">×'+Number(o.hits)+'</span></div>'+
    '<div class="meta">last seen '+relTime(o.last_seen)+
      ' · first '+relTime(o.first_seen)+'</div>'+
  '</div>';
  return el;
}

async function refresh(){
  const r=await fetch('/api/observations?limit=200&label='+encodeURIComponent(q.value.trim()));
  if(!r.ok){console.error('list failed',r.status);return}
  const obs=await r.json();
  grid.replaceChildren(...obs.map(card));
  const empty=$('#empty');
  if(obs.length){empty.style.display='none'}
  else{
    empty.style.display='block';
    empty.innerHTML=q.value.trim()
      ? 'No objects match “'+esc(q.value.trim())+'”.'
      : 'No observations yet — run the ingest loop:<br><code>cargo run --features "rtsp,yolo" -p item-ingest -- --rtsp &lt;url&gt; --camera-id &lt;id&gt; --config config.toml</code>';
  }
  $('#count').textContent=obs.length+' observation'+(obs.length===1?'':'s');
}

let timer;
q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(refresh,250)});

grid.addEventListener('click',e=>{
  const s=e.target.closest('.shot[data-full]');
  if(!s)return;
  $('#modalimg').src=s.dataset.full;
  $('#modalcap').textContent=s.dataset.cap;
  $('#modal').showModal();
});
$('#close').onclick=()=>$('#modal').close();

async function ask(){
  const t=askq.value.trim();
  if(!t)return;
  answer.style.display='block';
  answer.textContent='thinking…';
  const r=await fetch('/api/ask?q='+encodeURIComponent(t));
  if(!r.ok){answer.textContent='ask failed ('+r.status+')';return}
  const d=await r.json();
  const m=d.matched||[];
  // The direct last sighting always leads; a VLM sentence or a hypothesis
  // never replaces it.
  let html='';
  if(d.mode==='vlm')html+='<div class="direct">'+esc(d.answer)+'</div>';
  else if(m.length){
    const o=m[0];
    html+='<div class="direct"><b>'+esc(o.label)+'</b> was last directly seen at <b>'+
      esc(o.camera)+' / '+esc(o.zone)+'</b>, '+esc(relTime(o.last_seen))+'.</div>';
    if(m.length>1)html+='<div class="note">earlier: '+m.slice(1,6).map(o=>
      esc(o.label)+' @ '+esc(o.zone)+' ('+esc(relTime(o.last_seen))+')').join('; ')+'</div>';
  }else html+='<div class="direct">Nothing recorded that matches “'+esc(t)+'” yet.</div>';
  if(d.error)html+='<div class="note">VLM unavailable ('+esc(d.error)+'); showing the log.</div>';
  if(d.note)html+='<div class="note">'+esc(d.note)+'</div>';
  const cards=d.cards||[];
  if(cards.length)html+='<div id="cards">'+cards.map(evidenceCard).join('')+'</div>';
  else if(m.length&&!d.note)html+='<div class="note">No supported covering/container hypothesis was found.</div>';
  answer.innerHTML=html;
}

const fmtTime=iso=>new Date(iso).toLocaleTimeString();
const signed=s=>(s>=0?'+':'−')+Math.abs(s).toFixed(1)+' s';

function evidenceCard(c){
  const d=c.direct, h=c.hypothesis, p=c.provenance;
  const ev=h.evidence.map(e=>'<li><span class="st st-'+esc(e.state)+'">'+esc(e.state)+'</span> '+
    '<b>'+esc(e.kind.replace(/_/g,' '))+'</b> — '+esc(e.detail)+'</li>').join('');
  const depth=c.depth.length
    ? '<p>depth: '+c.depth.map(x=>esc(x.role)+' '+esc(x.relation_to_camera)+' ('+esc(x.provider)+
        (x.model_ref?' / '+esc(x.model_ref):'')+', '+esc(x.mode)+', quality '+esc(x.quality)+')').join('; ')+'</p>'
    : '<p>depth: none recorded</p>';
  return '<section class="ev">'+
    '<h3><span class="tag">hypothesis</span>'+esc(d.label)+' may be '+esc(h.phrase)+' the '+
      esc(h.cover_label)+'<span class="score" title="ranks hypotheses; not a probability">score '+
      Number(h.score).toFixed(2)+' · '+esc(h.relation)+'</span></h3>'+
    '<p class="expl">'+esc(h.explanation)+'</p>'+
    '<div class="tl"><span>'+esc(d.label)+' last seen '+esc(fmtTime(h.target_last_hit))+'</span>'+
      '<span>'+esc(h.cover_label)+' appeared '+esc(signed(h.cover_offset_s))+'</span>'+
      '<span>'+esc(d.camera)+' / '+esc(d.zone)+'</span></div>'+
    '<ul>'+ev+'</ul>'+
    '<div class="shots">'+shot(c.geometry.target,c.geometry.cover,d.label+' (last seen)')+
      shot(c.geometry.cover,c.geometry.target,h.cover_label)+'</div>'+
    '<details><summary>provenance</summary>'+depth+
      '<p>rule <code>'+esc(p.rule_version)+'</code> · priors <code>'+esc(p.priors_ref)+'</code> · events #'+
      Number(p.target_event_id)+' / #'+Number(p.cover_event_id)+'</p></details>'+
    '<div class="caveat">'+esc(c.caveat)+'</div>'+
  '</section>';
}

// One evidence sample: its own snapshot (if any) with both boxes drawn on
// top, so the overlap the rule measured is visible. The sample's box is solid,
// the other side's is dashed.
function shot(own,other,caption){
  if(!own)return '';
  const w=Number(own.frame_width)||0, hgt=Number(own.frame_height)||0;
  const rect=(g,cls)=>{
    if(!g||!w||!hgt||g.frame_width!==own.frame_width||g.frame_height!==own.frame_height)return '';
    const [x0,y0,x1,y1]=g.bbox.map(Number);
    return '<rect class="'+cls+'" x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" fill="none" '+
      (cls==='own'?'stroke="#7dd3fc" stroke-width="'+Math.max(2,w/320)+'"'
                  :'stroke="#fbbf24" stroke-dasharray="'+(w/80)+'" stroke-width="'+Math.max(2,w/400)+'"')+'/>';
  };
  const svg=w&&hgt?'<svg viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="xMidYMid meet">'+
    rect(other,'other')+rect(own,'own')+'</svg>':'';
  const img=own.has_snapshot
    ? '<img loading="lazy" src="/api/geometry/'+Number(own.geometry_id)+'/snapshot" alt="'+esc(caption)+'">'
    : '<div class="blank">no snapshot for this sample</div>';
  return '<figure>'+img+svg+'<figcaption>'+esc(caption)+' · '+esc(own.source)+' · '+
    esc(fmtTime(own.captured_at))+'</figcaption></figure>';
}
$('#askbtn').onclick=ask;
askq.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});

refresh();
setInterval(refresh,10000);
</script>
</body>
</html>
