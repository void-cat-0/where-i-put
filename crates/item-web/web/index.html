<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>where-i-put</title>
<style>
  :root{
    --bg:#12141a; --card:#1c2029; --card2:#232836; --line:#2c3242;
    --text:#e8eaf0; --dim:#9aa3b5; --accent:#7dd3fc; --chip:#2b3a4d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 system-ui,'Segoe UI',sans-serif}
  header{position:sticky;top:0;z-index:5;background:#12141add;
         backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
         padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.3px}
  h1 .dot{color:var(--accent)}
  .grow{flex:1}
  input[type=search],input[type=text]{background:var(--card2);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:180px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--chip);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:8px 14px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  #answer{display:none;margin:16px 20px 0;padding:14px 16px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px}
  #grid{display:grid;gap:14px;padding:20px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column}
  .shot{aspect-ratio:16/9;background:#0c0e13;display:flex;align-items:center;
    justify-content:center;color:var(--dim);font-size:13px;cursor:zoom-in}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .label{font-size:17px;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--chip);border-radius:20px;padding:2px 10px;font-size:12.5px;color:#cfe3f5}
  .meta{color:var(--dim);font-size:12.5px}
  .hits{margin-left:auto;color:var(--accent);font-size:12.5px;font-weight:600}
  #empty{display:none;padding:60px 20px;text-align:center;color:var(--dim)}
  #empty code{background:var(--card2);padding:2px 6px;border-radius:6px}
  dialog{background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:12px;max-width:min(1100px,94vw);padding:0}
  dialog::backdrop{background:#000a}
  dialog img{display:block;max-width:100%}
  dialog .cap{padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:8px 20px 18px}
</style>
</head>
<body>
<header>
  <h1>where<span class="dot">·</span>i<span class="dot">·</span>put</h1>
  <input id="q" type="search" placeholder="filter by object…" title='e.g. cup, person, chair' aria-label="filter by object">
  <div class="grow"></div>
  <input id="askq" type="text" placeholder="where is the cup?" title='Ask in plain words, e.g. "where did I put the remote"' aria-label="ask a question" style="min-width:200px">
  <button id="askbtn">Ask</button>
</header>

<div id="answer"></div>
<main id="grid"></main>
<div id="empty">
  No observations yet — run the ingest loop:<br>
  <code>cargo run --features "rtsp,yolo" -p item-ingest -- --rtsp &lt;url&gt; --camera-id &lt;id&gt; --config config.toml</code>
</div>
<dialog id="modal">
  <img id="modalimg" alt="observation snapshot">
  <div class="cap"><span id="modalcap"></span><button id="close">Close</button></div>
</dialog>
<footer>auto-refreshes every 10s · <span id="count"></span></footer>

<script>
const $=s=>document.querySelector(s);
const grid=$('#grid'), q=$('#q'), askq=$('#askq'), answer=$('#answer');

function relTime(iso){
  const d=(Date.now()-new Date(iso))/1000;
  if(d<60)return 'just now';
  if(d<3600)return Math.floor(d/60)+' min ago';
  if(d<86400)return Math.floor(d/3600)+' h ago';
  return new Date(iso).toLocaleString();
}

function card(o){
  const el=document.createElement('article');
  el.className='card';
  const url='/api/observation/'+o.id+'/snapshot';
  const shot=o.has_snapshot
    ? '<div class="shot" data-full="'+url+'" data-cap="'+o.label+' @ '+o.zone+'"><img loading="lazy" src="'+url+'" alt="'+o.label+' in '+o.zone+'"></div>'
    : '<div class="shot">no snapshot</div>';
  el.innerHTML=shot+'<div class="body">'+
    '<div class="label">'+o.label+'</div>'+
    '<div class="row"><span class="chip">'+o.zone+'</span>'+
      '<span class="chip">'+o.camera+'</span>'+
      '<span class="hits">×'+o.hits+'</span></div>'+
    '<div class="meta">last seen '+relTime(o.last_seen)+
      ' · first '+relTime(o.first_seen)+'</div>'+
  '</div>';
  return el;
}

async function refresh(){
  const r=await fetch('/api/observations?limit=200&label='+encodeURIComponent(q.value.trim()));
  if(!r.ok){console.error('list failed',r.status);return}
  const obs=await r.json();
  grid.replaceChildren(...obs.map(card));
  const empty=$('#empty');
  if(obs.length){empty.style.display='none'}
  else{
    empty.style.display='block';
    empty.innerHTML=q.value.trim()
      ? 'No objects match “'+q.value.trim().replace(/</g,'&lt;')+'”.'
      : 'No observations yet — run the ingest loop:<br><code>cargo run --features "rtsp,yolo" -p item-ingest -- --rtsp &lt;url&gt; --camera-id &lt;id&gt; --config config.toml</code>';
  }
  $('#count').textContent=obs.length+' observation'+(obs.length===1?'':'s');
}

let timer;
q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(refresh,250)});

grid.addEventListener('click',e=>{
  const s=e.target.closest('.shot[data-full]');
  if(!s)return;
  $('#modalimg').src=s.dataset.full;
  $('#modalcap').textContent=s.dataset.cap;
  $('#modal').showModal();
});
$('#close').onclick=()=>$('#modal').close();

async function ask(){
  const t=askq.value.trim();
  if(!t)return;
  answer.style.display='block';
  answer.textContent='thinking…';
  const r=await fetch('/api/ask?q='+encodeURIComponent(t));
  const d=await r.json();
  if(d.mode==='vlm'){answer.textContent=d.answer;return}
  if(d.error){answer.textContent='(VLM failed: '+d.error+') '}
  const m=d.matched||[];
  answer.textContent=m.length
    ? 'log match for “'+t+'”: '+m.map(o=>o.label+' @ '+o.zone+' ('+relTime(o.last_seen)+')').join('; ')
    : 'nothing recorded that matches “'+t+'” yet.';
}
$('#askbtn').onclick=ask;
askq.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});

refresh();
setInterval(refresh,10000);
</script>
</body>
</html>
