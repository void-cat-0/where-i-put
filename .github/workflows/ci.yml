name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# On failure we tee the command output and re-emit the tail as `::error::`
# annotations -- job logs need repo auth to download, annotations are public.
jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log || {
            tail -40 clippy.log | sed 's/^/::error::/' ; exit 1; }
      - name: test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log || {
            tail -40 test.log | sed 's/^/::error::/' ; exit 1; }

  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [camera, yolo, "yolo,camera"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings 2>&1 | tee clippy.log || {
            tail -40 clippy.log | sed 's/^/::error::/' ; exit 1; }
      - name: test
        run: |
          set -o pipefail
          cargo test --workspace --features "${{ matrix.features }}" 2>&1 | tee test.log || {
            tail -40 test.log | sed 's/^/::error::/' ; exit 1; }

  rtsp-zip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: xtask setup (pinned zip path)
        run: |
          set -o pipefail
          cargo xtask setup 2>&1 | tee setup.log || {
            tail -40 setup.log | sed 's/^/::error::/' ; exit 1; }
      - run: cargo xtask status
      - name: test
        run: |
          set -o pipefail
          cargo test --workspace --features rtsp 2>&1 | tee test.log || {
            tail -60 test.log | sed 's/^/::error::/' ; exit 1; }

  rtsp-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev nasm make
      - name: macos deps
        if: matrix.os == 'macos-latest'
        run: brew install nasm make llvm
      - name: macos libclang path (config.toml force=false lets this win)
        if: matrix.os == 'macos-latest'
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: windows msys2 tools (path:false keeps cl.exe winning over msys gcc)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make nasm perl
          path: false
      - name: windows MSVC developer env
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: windows add msys usr/bin (after msvc env so cl wins)
        if: matrix.os == 'windows-latest'
        run: echo "C:\\msys64\\usr\\bin" >> "$GITHUB_PATH"
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build ffmpeg from source (tail on failure)
        run: |
          set -o pipefail
          cargo xtask setup --from-source 2>&1 | tee source-build.log || {
            tail -60 source-build.log | sed 's/^/::error::/' ; exit 1; }
      - name: test against source tree
        run: |
          set -o pipefail
          cargo test --workspace --features rtsp 2>&1 | tee test.log || {
            tail -60 test.log | sed 's/^/::error::/' ; exit 1; }
