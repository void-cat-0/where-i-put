# Toolchain env for the `rtsp` feature (FFmpeg + libclang), populated into
# target/vendor by `cargo xtask setup`. `relative` resolves against this
# file's directory; `force = false` lets an externally-set value win.
# cargo clean removes target/vendor, so setup is re-runnable and cheap.
# Runtime DLLs are NOT PATH-based: item-ingest's build.rs stages them next
# to the exe (works for cargo run, direct launch, and folder deployment).
[env]
FFMPEG_DIR = { value = "target/vendor/ffmpeg", relative = true, force = false }
LIBCLANG_PATH = { value = "target/vendor/libclang/native", relative = true, force = false }

[alias]
xtask = "run --package xtask --"
